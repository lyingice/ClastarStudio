[package]
name = "clastar-studio"
version = "1.0.0"
description = "像素工坊 · PIXEL WORKSHOP — 本地优先 Minecraft 纹理工作台"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
