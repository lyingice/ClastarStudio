plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clastar.pixelworkshop'
    compileSdk 34

    defaultConfig {
        applicationId "com.clastar.pixelworkshop"
        minSdk 29
        targetSdk 34
        versionCode 10000
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
