name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前工作流中哪里不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 描述你期望的界面与操作方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 是否涉及编辑器、资源包路径、localStorage 结构或移动端？
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue。
          required: true
        - label: 这不是安全漏洞；安全漏洞请使用私密 Security Advisory。
          required: true
