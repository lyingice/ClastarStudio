name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist-release
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG=dev ;;
          esac
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist-release/ClastarStudio-$TAG-android.apk"
          ls -lh dist-release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clastar-studio-android-apk
          path: dist-release/*-android.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-release/*-android.apk --clobber
