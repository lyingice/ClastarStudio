name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'plugin.json'
      - 'plugins/**'
      - 'integrations/**'
      - 'src/**'
      - 'styles/**'
      - 'tools/static_manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          python - <<'EOF'
          import json, shutil
          from pathlib import Path
          m = json.loads(Path("tools/static_manifest.json").read_text(encoding="utf-8"))
          site = Path("_site")
          site.mkdir(exist_ok=True)
          for f in m["root_files"]:
              shutil.copy2(f, site / f)
          for d in m["directories"]:
              shutil.copytree(d, site / d, ignore=shutil.ignore_patterns("*.map"))
          print(f"Built _site ({sum(1 for p in site.rglob('*') if p.is_file())} files)")
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
