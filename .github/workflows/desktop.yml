name: Build Desktop (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Validate static repository
        run: python tools/check_repo.py

      - name: Prepare static dist
        working-directory: desktop
        run: python prepare_dist.py

      - name: Copy icon
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force -Path icons | Out-Null
          Copy-Item ../clastar.ico icons/icon.ico -Force

      - name: Build Tauri app
        working-directory: desktop
        run: cargo tauri build

      - name: Package static web/mobile zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev" }
          $stage = "dist-release/ClastarStudio-$tag"
          Remove-Item -Recurse -Force "dist-release" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          $man = Get-Content "tools/static_manifest.json" -Raw | ConvertFrom-Json
          foreach ($f in $man.root_files) {
            Copy-Item $f (Join-Path $stage $f)
          }
          foreach ($d in $man.directories) {
            Copy-Item -Recurse $d (Join-Path $stage $d)
          }
          Compress-Archive -Path $stage -DestinationPath "dist-release/ClastarStudio-$tag.zip" -Force
          Copy-Item "desktop/target/release/clastar-studio.exe" "dist-release/ClastarStudio-$tag-portable.exe" -Force
          $setup = Get-ChildItem "desktop/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "dist-release/ClastarStudio-$tag-setup.exe" -Force

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: clastar-studio-windows-nsis
          path: dist-release/ClastarStudio-*-setup.exe

      - name: Upload static zip
        uses: actions/upload-artifact@v4
        with:
          name: clastar-studio-static-zip
          path: dist-release/ClastarStudio-*.zip

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: clastar-studio-portable-exe
          path: dist-release/ClastarStudio-*-portable.exe

      - name: Drop legacy-named installer asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              for (const a of rel.data.assets) {
                if (a.name.startsWith('_')) {
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
                  core.info('removed legacy asset ' + a.name);
                }
              }
            } catch (e) {
              core.info('no existing release for ' + tag + ', skipping cleanup');
            }
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 像素工坊 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-release/ClastarStudio-*-setup.exe
            dist-release/ClastarStudio-*-portable.exe
            dist-release/ClastarStudio-*.zip
