name: Build Desktop (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Validate static repository
        run: python tools/check_repo.py

      - name: Prepare static dist
        working-directory: desktop
        run: python prepare_dist.py

      - name: Copy icon
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force -Path icons | Out-Null
          Copy-Item ../clastar.ico icons/icon.ico -Force

      - name: Build Tauri app
        working-directory: desktop
        run: cargo tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: clastar-studio-windows-nsis
          path: desktop/target/release/bundle/nsis/*.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/target/release/bundle/nsis/*.exe
